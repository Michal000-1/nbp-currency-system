services:
  nbp-app-backend:
    build:
      context: .
      dockerfile: Containerfile.backend
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
  nbp-app-frontend:
    build:
      context: .
      dockerfile: Containerfile.frontend
    ports:
      - "8501:8501"
    depends_on:
      nbp-app-backend:
        condition: service_healthy
